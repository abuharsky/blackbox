name: blackbox
description: >
  State management with one law: output = compute(input, state). Boxes with
  private memory, an explicit dependency graph you can render as a map,
  built-in persistence and caching. No code generation.
repository: https://github.com/abuharsky/blackbox/tree/main/packages/blackbox_core
version: 0.10.10
license: MIT
topics:
  - reactive
  - state-management
  - data-flow
  - dependency-graph
  - computation-graph

environment:
  sdk: ">=3.5.0 <4.0.0"
resolution: workspace

dependencies:
  meta: ^1.17.0

dev_dependencies:
  test: ^1.25.0
